version: '3.8'

services:
  # 1. FastAPI Backend & Streaming ML Service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runner
    container_name: krishiloop-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite:////app/backend/retail_ops.db
      - API_KEY=${API_KEY:-dev-secret-key-change-in-prod}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost}
      - AUTO_START_STREAMING=true
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/retail_ops.db:/app/backend/retail_ops.db
      - ./backend/mlruns:/app/backend/mlruns
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: always
    networks:
      - krishiloop-net

  # 2. React Production Frontend (Nginx Container)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runner
    container_name: krishiloop-frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: always
    networks:
      - krishiloop-net

networks:
  krishiloop-net:
    driver: bridge
