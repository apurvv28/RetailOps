version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - npm ci || npm install
    build:
      commands:
        - env | grep -e VITE_ >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
