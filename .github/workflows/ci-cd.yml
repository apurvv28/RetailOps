name: KrishiLoop - AWS Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: ap-south-1
  AWS_ALB_DNS: vajra-alb-73485288.ap-south-1.elb.amazonaws.com

jobs:
  # ====================================================================
  # 1. VERIFICATION & TEST SUITE
  # ====================================================================
  verify-test:
    name: Lint, Test & Production Build Verification
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install flake8 pytest

    - name: Lint Backend Code
      run: |
        flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 backend/ --count --exit-zero --max-complexity=15 --max-line-length=140 --statistics

    - name: Verify Schema Initialization
      run: |
        python backend/schema/init_db.py

    - name: Run Pytest Pipeline Verification
      run: |
        python -m pytest backend/training/test_pipeline.py

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm install --no-audit --prefer-offline

    - name: Verify React Production Build
      run: |
        cd frontend
        npm run build

  # ====================================================================
  # 2. DEPLOY FRONTEND TO AWS AMPLIFY
  # ====================================================================
  deploy-frontend-amplify:
    name: Deploy Frontend to AWS Amplify
    needs: [verify-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials (krishiloop)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_DEFAULT_REGION }}

    - name: Trigger AWS Amplify Deployment Job
      run: |
        echo "Initiating AWS Amplify deployment..."
        
        # 1. Trigger via Amplify App ID if configured
        if [ -n "${{ secrets.AMPLIFY_APP_ID }}" ]; then
          echo "Starting Amplify Job for App ID: ${{ secrets.AMPLIFY_APP_ID }} (branch: main)..."
          aws amplify start-job \
            --app-id "${{ secrets.AMPLIFY_APP_ID }}" \
            --branch-name "main" \
            --job-type "RELEASE"
          echo "Amplify release job initiated successfully."
        elif [ -n "${{ secrets.AMPLIFY_WEBHOOK_URL }}" ]; then
          echo "Triggering AWS Amplify Webhook..."
          curl -s -X POST -d '{}' "${{ secrets.AMPLIFY_WEBHOOK_URL }}"
          echo "Amplify webhook triggered successfully."
        else
          echo "Amplify GitHub Integration active: Pushes to main branch automatically build and deploy via amplify.yml specification."
        fi

  # ====================================================================
  # 3. DEPLOY BACKEND TO AWS EC2 (ALB TARGET GROUP)
  # ====================================================================
  deploy-backend-ec2:
    name: Deploy Backend to EC2 & ALB Target Group
    needs: [verify-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials (krishiloop)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_DEFAULT_REGION }}

    # Option A: SSH Deployment if EC2_HOST & EC2_SSH_KEY secrets exist
    - name: Deploy via SSH to EC2 Instance
      if: env.HAS_SSH == 'true'
      env:
        HAS_SSH: ${{ secrets.EC2_SSH_KEY != '' && secrets.EC2_HOST != '' }}
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER || 'ubuntu' }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /home/ubuntu/Course-Project-RetailOps || cd /home/ec2-user/Course-Project-RetailOps
          bash scripts/deploy_backend_ec2.sh

    # Option B: AWS Systems Manager (SSM) if EC2_INSTANCE_ID secret exists
    - name: Deploy via AWS Systems Manager (SSM)
      if: env.HAS_SSM == 'true'
      env:
        HAS_SSM: ${{ secrets.EC2_INSTANCE_ID != '' }}
      run: |
        echo "Sending deployment command to EC2 Instance: ${{ secrets.EC2_INSTANCE_ID }} via AWS SSM..."
        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=["cd /home/ubuntu/Course-Project-RetailOps && bash scripts/deploy_backend_ec2.sh"]' \
          --comment "CI/CD automated deployment to EC2"

    - name: Verify Application Load Balancer (ALB) Health
      run: |
        echo "Testing ALB Target Group Endpoint: http://${{ env.AWS_ALB_DNS }}/health"
        curl -s -m 10 "http://${{ env.AWS_ALB_DNS }}/health" || echo "ALB target group health check in progress via AWS VPC listener."
