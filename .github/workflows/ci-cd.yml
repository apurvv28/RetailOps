name: KrishiLoop - AWS Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: ap-south-1
  AWS_ALB_DNS: krishiloop-alb-1915260657.ap-south-1.elb.amazonaws.com
  AMPLIFY_APP_ID: debl68w4trakj

jobs:
  # ====================================================================
  # 1. VERIFICATION & TEST SUITE
  # ====================================================================
  verify-test:
    name: Lint, Test & Production Build Verification
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install flake8 pytest

    - name: Lint Backend Code
      run: |
        flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 backend/ --count --exit-zero --max-complexity=15 --max-line-length=140 --statistics

    - name: Verify Schema Initialization
      run: |
        python backend/schema/init_db.py

    - name: Run Pytest Pipeline Verification
      run: |
        python -m pytest backend/training/test_pipeline.py

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm install --no-audit --prefer-offline

    - name: Verify React Production Build
      run: |
        cd frontend
        npm run build

  # ====================================================================
  # 2. DEPLOY FRONTEND TO AWS AMPLIFY
  # ====================================================================
  deploy-frontend-amplify:
    name: Deploy Frontend to AWS Amplify
    needs: [verify-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials (krishiloop)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_DEFAULT_REGION }}

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build & Deploy Frontend to AWS Amplify
      run: |
        APP_ID="${{ secrets.AMPLIFY_APP_ID || env.AMPLIFY_APP_ID }}"
        echo "Building and deploying to AWS Amplify App ID: $APP_ID (branch: main)..."
        
        cd frontend
        npm install --no-audit --prefer-offline
        npm run build
        cd dist
        zip -rq ../../frontend_dist.zip .
        cd ../..

        DEP_JSON=$(aws amplify create-deployment --app-id "$APP_ID" --branch-name "main" --region "${{ env.AWS_DEFAULT_REGION }}")
        JOB_ID=$(echo "$DEP_JSON" | jq -r .jobId)
        UPLOAD_URL=$(echo "$DEP_JSON" | jq -r .zipUploadUrl)

        echo "Uploading frontend artifact package (Job $JOB_ID)..."
        curl -s -T frontend_dist.zip "$UPLOAD_URL"

        echo "Starting AWS Amplify Deployment Job $JOB_ID..."
        aws amplify start-deployment --app-id "$APP_ID" --branch-name "main" --job-id "$JOB_ID" --region "${{ env.AWS_DEFAULT_REGION }}"
        echo "Amplify deployment successfully initiated!"

  # ====================================================================
  # 3. DEPLOY BACKEND TO AWS EC2 (ALB TARGET GROUP)
  # ====================================================================
  deploy-backend-ec2:
    name: Deploy Backend to EC2 & ALB Target Group
    needs: [verify-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials (krishiloop)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_DEFAULT_REGION }}

    - name: Discover EC2 Target & Resolve Live IP
      id: ec2_target
      run: |
        INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
        if [ -z "$INSTANCE_ID" ]; then
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=krishiloop-backend-server" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text --region ${{ env.AWS_DEFAULT_REGION }})
        fi
        if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
          INSTANCE_ID="i-054e7f4de476018db"
        fi

        LIVE_IP=$(aws ec2 describe-instances \
          --instance-ids "$INSTANCE_ID" \
          --query "Reservations[0].Instances[0].PublicIpAddress" \
          --output text --region ${{ env.AWS_DEFAULT_REGION }})

        echo "Target Instance ID: $INSTANCE_ID"
        echo "Live Public IP: $LIVE_IP"
        echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
        echo "live_ip=$LIVE_IP" >> $GITHUB_OUTPUT

    # Primary: AWS Systems Manager (SSM) Deployment (Serverless IAM execution, immune to IP changes)
    - name: Deploy via AWS Systems Manager (SSM)
      id: ssm_deploy
      continue-on-error: true
      run: |
        TARGET_INSTANCE="${{ steps.ec2_target.outputs.instance_id }}"
        echo "Sending deployment command to EC2 Instance: $TARGET_INSTANCE via AWS SSM..."
        CMD_ID=$(aws ssm send-command \
          --instance-ids "$TARGET_INSTANCE" \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=["sudo -u ubuntu -i bash -c \"cd /home/ubuntu/Course-Project-RetailOps && bash scripts/deploy_backend_ec2.sh\""]' \
          --comment "CI/CD automated deployment to EC2 via SSM" \
          --query "Command.CommandId" \
          --output text \
          --region ${{ env.AWS_DEFAULT_REGION }})

        echo "Command dispatched with ID: $CMD_ID. Waiting for execution..."
        aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$TARGET_INSTANCE" --region ${{ env.AWS_DEFAULT_REGION }}
        
        STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$TARGET_INSTANCE" --query "Status" --output text --region ${{ env.AWS_DEFAULT_REGION }})
        echo "SSM Execution Status: $STATUS"
        if [ "$STATUS" != "Success" ]; then
          echo "SSM command did not report success. Output details:"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$TARGET_INSTANCE" --region ${{ env.AWS_DEFAULT_REGION }}
          exit 1
        fi
        echo "SSM Deployment successfully completed on EC2."

    # Fallback: SSH Deployment using Live IP if SSM failed or was skipped
    - name: Deploy via SSH to EC2 Instance (Fallback)
      if: steps.ssm_deploy.outcome != 'success' && env.EC2_SSH_KEY != ''
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ steps.ec2_target.outputs.live_ip || env.EC2_HOST }}
        username: ${{ secrets.EC2_USER || 'ubuntu' }}
        key: ${{ env.EC2_SSH_KEY }}
        script: |
          cd /home/ubuntu/Course-Project-RetailOps || cd /home/ec2-user/Course-Project-RetailOps
          bash scripts/deploy_backend_ec2.sh

    - name: Verify Application Load Balancer (ALB) Health
      run: |
        echo "Testing ALB Target Group Endpoint: http://${{ env.AWS_ALB_DNS }}/health"
        curl -s -m 10 "http://${{ env.AWS_ALB_DNS }}/health" || echo "ALB target group health check in progress via AWS VPC listener."
