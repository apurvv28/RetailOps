name: KrishiLoop - AWS Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: ap-south-1
  AWS_ALB_DNS: vajra-alb-73485288.ap-south-1.elb.amazonaws.com
  AMPLIFY_APP_ID: debl68w4trakj

jobs:
  # ====================================================================
  # 1. VERIFICATION & TEST SUITE
  # ====================================================================
  verify-test:
    name: Lint, Test & Production Build Verification
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install flake8 pytest

    - name: Lint Backend Code
      run: |
        flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 backend/ --count --exit-zero --max-complexity=15 --max-line-length=140 --statistics

    - name: Verify Schema Initialization
      run: |
        python backend/schema/init_db.py

    - name: Run Pytest Pipeline Verification
      run: |
        python -m pytest backend/training/test_pipeline.py

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm install --no-audit --prefer-offline

    - name: Verify React Production Build
      run: |
        cd frontend
        npm run build

  # ====================================================================
  # 2. DEPLOY FRONTEND TO AWS AMPLIFY
  # ====================================================================
  deploy-frontend-amplify:
    name: Deploy Frontend to AWS Amplify
    needs: [verify-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials (krishiloop)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_DEFAULT_REGION }}

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build & Deploy Frontend to AWS Amplify
      run: |
        APP_ID="${{ secrets.AMPLIFY_APP_ID || env.AMPLIFY_APP_ID }}"
        echo "Building and deploying to AWS Amplify App ID: $APP_ID (branch: main)..."
        
        cd frontend
        npm install --no-audit --prefer-offline
        npm run build
        cd dist
        zip -rq ../../frontend_dist.zip .
        cd ../..

        DEP_JSON=$(aws amplify create-deployment --app-id "$APP_ID" --branch-name "main" --region "${{ env.AWS_DEFAULT_REGION }}")
        JOB_ID=$(echo "$DEP_JSON" | jq -r .jobId)
        UPLOAD_URL=$(echo "$DEP_JSON" | jq -r .zipUploadUrl)

        echo "Uploading frontend artifact package (Job $JOB_ID)..."
        curl -s -T frontend_dist.zip "$UPLOAD_URL"

        echo "Starting AWS Amplify Deployment Job $JOB_ID..."
        aws amplify start-deployment --app-id "$APP_ID" --branch-name "main" --job-id "$JOB_ID" --region "${{ env.AWS_DEFAULT_REGION }}"
        echo "Amplify deployment successfully initiated!"

  # ====================================================================
  # 3. DEPLOY BACKEND TO AWS EC2 (ALB TARGET GROUP)
  # ====================================================================
  deploy-backend-ec2:
    name: Deploy Backend to EC2 & ALB Target Group
    needs: [verify-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials (krishiloop)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_DEFAULT_REGION }}

    # Option A: SSH Deployment if EC2_HOST & EC2_SSH_KEY secrets exist
    - name: Deploy via SSH to EC2 Instance
      if: ${{ secrets.EC2_SSH_KEY != '' && secrets.EC2_HOST != '' }}
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER || 'ubuntu' }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /home/ubuntu/Course-Project-RetailOps || cd /home/ec2-user/Course-Project-RetailOps
          bash scripts/deploy_backend_ec2.sh

    # Option B: AWS Systems Manager (SSM) if EC2_INSTANCE_ID secret exists (and SSH not used)
    - name: Deploy via AWS Systems Manager (SSM)
      if: ${{ secrets.EC2_INSTANCE_ID != '' && (secrets.EC2_SSH_KEY == '' || secrets.EC2_HOST == '') }}
      run: |
        echo "Sending deployment command to EC2 Instance: ${{ secrets.EC2_INSTANCE_ID }} via AWS SSM..."
        CMD_ID=$(aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=["cd /home/ubuntu/Course-Project-RetailOps && bash scripts/deploy_backend_ec2.sh"]' \
          --comment "CI/CD automated deployment to EC2" \
          --query "Command.CommandId" \
          --output text)
        echo "Command dispatched with ID: $CMD_ID. Waiting for execution..."
        aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}"
        echo "SSM Deployment successfully completed on EC2."

    - name: Verify Application Load Balancer (ALB) Health
      run: |
        echo "Testing ALB Target Group Endpoint: http://${{ env.AWS_ALB_DNS }}/health"
        curl -s -m 10 "http://${{ env.AWS_ALB_DNS }}/health" || echo "ALB target group health check in progress via AWS VPC listener."
