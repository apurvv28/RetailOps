name: Retail Ops Intelligence - CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  repository_dispatch:
    types: [ auto_retrain ]

permissions:
  id-token: write # Required for Workload Identity Federation
  contents: write # Needed if we update tags or dispatch
  actions: write

jobs:
  test-backend:
    name: Backend - Lint & Pytest Verification
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install flake8 pytest

    - name: Lint with flake8
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats formatting as warnings
        flake8 backend/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Verify Database Initialization
      run: |
        python backend/schema/init_db.py

    - name: Run Pytest Unit Tests
      run: |
        python -m pytest backend/training/test_pipeline.py

  build-frontend:
    name: Frontend - Install & Production Build Verification
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci || npm install

    - name: Build React Vite Frontend
      run: |
        cd frontend
        npm run build

  check-secrets:
    name: Check GCP Deployment Secrets
    runs-on: ubuntu-latest
    outputs:
      gcp_secrets_set: ${{ steps.check.outputs.gcp_secrets_set }}
    steps:
    - id: check
      env:
        GCP_WIP: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      run: |
        if [ -n "$GCP_WIP" ]; then
          echo "gcp_secrets_set=true" >> $GITHUB_OUTPUT
        else
          echo "gcp_secrets_set=false" >> $GITHUB_OUTPUT
        fi

  build-and-deploy:
    name: Build Docker & Deploy to GCP Cloud Run
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend, check-secrets]
    if: ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'repository_dispatch' && github.event.action == 'auto_retrain')) && needs.check-secrets.outputs.gcp_secrets_set == 'true'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud via WIF
      id: auth
      uses: google-github-actions/auth@v2
      with:
        token_format: 'access_token'
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker for Artifact Registry
      run: |
        gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

    - name: Build and Tag Docker Image
      run: |
        IMAGE_NAME="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/retail-ops-repo/retail-ops-serving:latest"
        docker build -t $IMAGE_NAME ./backend
        echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

    - name: Push Image to Artifact Registry
      run: |
        docker push $IMAGE_NAME

    - name: Deploy to GCP Cloud Run (Canary 10% Traffic split)
      run: |
        gcloud run deploy retail-ops-service \
          --image ${{ env.IMAGE_NAME }} \
          --region ${{ secrets.GCP_REGION }} \
          --platform managed \
          --no-traffic \
          --allow-unauthenticated

        LATEST_REV=$(gcloud run revisions list --service retail-ops-service --region ${{ secrets.GCP_REGION }} --limit 1 --format="value(metadata.name)")
        
        gcloud run services update-traffic retail-ops-service \
          --region ${{ secrets.GCP_REGION }} \
          --to-revisions LATEST_REV=10
        
        echo "Successfully deployed revision $LATEST_REV with 10% traffic split."
